# Vanity domain → 同一台 production Node（5240）
# 唔好 ProxyPass 去 https://match.picklevibes.hk（會經 Cloudflare，易 403／路徑錯）
#
# 安裝：
#   sudo cp deploy/apache/match.gpcchkmo.org.conf /etc/apache2/sites-available/
#   sudo a2ensite match.gpcchkmo.org.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
# HTTPS 憑證（若未有）：
#   sudo certbot --apache -d match.gpcchkmo.org
# Certbot 加完 :443 後，把下面「業務規則」同樣貼入 sites-enabled 入面嘅 :443 VirtualHost
#（唔好另開重複 443；憑證行留畀 Certbot）

<VirtualHost *:80>
    ServerName match.gpcchkmo.org
    ServerAdmin admin@picklevibes.hk

    # 若 Cloudflare 係 Flexible／或 DNS only 打嚟 HTTP，一樣要代理到 Node
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ErrorLog ${APACHE_LOG_DIR}/match-gpcchkmo-error.log
    CustomLog ${APACHE_LOG_DIR}/match-gpcchkmo-access.log combined

    ProxyPreserveHost On
    ProxyRequests Off

    RewriteEngine On

    # 根路徑 → 指定大會（內部 rewrite，URL 列可保持 /）
    RewriteRule ^/$ /e/gpcc-1?date=2026-10-28&comp=6ae0366624e98702b06cd305 [L,QSA]

    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /socket.io/(.*) ws://127.0.0.1:5240/socket.io/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /socket.io/(.*) http://127.0.0.1:5240/socket.io/$1 [P,L]

    ProxyPass        /socket.io/ ws://127.0.0.1:5240/socket.io/
    ProxyPassReverse /socket.io/ ws://127.0.0.1:5240/socket.io/

    ProxyPass        / http://127.0.0.1:5240/
    ProxyPassReverse / http://127.0.0.1:5240/
</VirtualHost>

